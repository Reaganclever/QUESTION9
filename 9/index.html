<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Screening System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Recruitment Screening Tool</h1>

        <p class="subtitle">
            Click the button below to evaluate a job applicant.
        </p>

        <button onclick="startScreening()">
            Start Screening
        </button>

        <div id="resultBox">

            <h2>Screening Result</h2>

            <p id="output">
                No applicant screened yet.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
